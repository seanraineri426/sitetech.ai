name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Install Python dependencies for brief tests
        run: |
          cd tools/brief-reference
          python3 -m pip install --require-hashes -r requirements.txt

      - name: Test brief reference (offline, network isolated)
        run: |
          cd tools/brief-reference
          # Try sudo unshare -n first (GitHub runners support this)
          if sudo unshare -n python3 run_tests.py 2>/dev/null; then
            echo "✓ Tests passed with network namespace isolation"
          else
            echo "✗ Network namespace isolation failed"
            echo "Tests MUST run with either sudo unshare -n or docker --network none"
            exit 1
          fi

  rls-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: pnpm supabase start

      - name: Run pgTAP tests
        run: pnpm supabase test db

      - name: Export Supabase env vars
        run: |
          pnpm supabase status -o env > /tmp/supabase-env
          cat /tmp/supabase-env >> $GITHUB_ENV

      - name: Run RLS integration tests
        run: pnpm test lib/supabase/__tests__/rls.test.ts

      - name: Stop Supabase
        if: always()
        run: pnpm supabase stop --no-backup
